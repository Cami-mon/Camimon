    body {

/* HEADER */

.hero {
  position: relative;
  max-width: 1400px;
  margin: 0 auto;
  padding: 5rem 4% 3rem;

  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.9s ease forwards;
}

/* pequeña línea superior */
.hero::before {
  content: "";
  display: block;
  width: 100%;
  height: 1px;
  background: #d8d8d8;
  margin-bottom: 2rem;
}

/* nombre */
.hero h1 {
  margin: 0;
  font-size: clamp(3rem, 7vw, 7rem);
  line-height: 0.9;
  font-weight: 600;
  letter-spacing: -0.055em;
  color: #111;
}

/* subtítulo */
.hero p {
  margin-top: 1.5rem;
  font-size: clamp(1rem, 1.5vw, 1.35rem);
  line-height: 1.3;
  font-weight: 400;
  color: #555;
  max-width: 420px;
}

/* metadata */
.hero-meta {
  position: absolute;
  top: 5rem;
  right: 4%;
  
  font-size: 0.65rem;
  line-height: 1.6;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #777;
  text-align: right;
}

/* línea debajo */
.hero-line {
  width: 100%;
  height: 1px;
  background: #d8d8d8;
  margin: 4rem 0 0;
}

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

    /* Reflejos neón */
    .neon-text {
      color: #222121;
      text-shadow: none;
    }

    /* Botones arcade */
    .arcade-btn {
      background-color: transparent;
      border: 2px solid #00ffff;
      color: #00ffff;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      transition: all 0.2s ease;
    }

    .arcade-btn:hover {
      background-color: #00ffff;
      color: #4d4d4e;
      box-shadow: 0 0 10px #101111, 0 0 20px #0c0b0c;
    }

    /* Carrusel */
.carousel {
  position: relative;
  width: 92%;
  max-width: 1400px;
  margin: 0 auto;
  overflow: hidden;
  border-radius: 20px;
}

.carousel-slide {
  display: none;
  position: relative;
}

.carousel-slide.active {
  display: block;
}

.carousel-slide iframe {
  width: 100%;
  aspect-ratio: 16 / 9;
  max-height: 70vh;
  border: none;
  border-radius: 20px;
  display: block;
}

/* Flechas */
.carousel-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-10%);
  z-index: 100;

  width: 56px;
  height: 56px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 999px;

  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(10px);

  color: white;
  font-size: 1.5rem;

  cursor: pointer;

  opacity: 0;
  transition: all 0.3s ease;
}

/* Mostrar flechas al pasar el mouse */
.carousel:hover .carousel-btn {
  opacity: 1;
}

.carousel-btn:hover {
  background: rgba(255,255,255,0.9);
  color: black;
  transform: translateY(-50%) scale(1.08);
}

.carousel-btn.prev {
  left: 20px;
}

.carousel-btn.next {
  right: 20px;
}

/* Responsive */
@media (max-width: 1200px) {
  .carousel {
    width: 95%;
  }
}

@media (max-width: 768px) {
  .carousel-btn {
    width: 44px;
    height: 44px;
    font-size: 1.2rem;
  }

  .carousel-btn.prev {
    left: 10px;
  }

  .carousel-btn.next {
    right: 10px;
  }
}

    a.youtube-link {

  <!-- Script -->
  <script src="https://player.vimeo.com/api/player.js"></script>
  <script>
    const slides = document.querySelectorAll('.carousel-slide');
    let currentIndex = 0;
    const players = [];

    slides.forEach(slide => {
      const iframe = slide.querySelector('iframe');
      const player = new Vimeo.Player(iframe);
      players.push(player);
      player.pause().catch(()=>{});
    });

    function showSlide(index) {
      slides.forEach((slide, i) => {
        const isActive = i === index;
        slide.classList.toggle('active', isActive);
        const player = players[i];
        if (player) {
          if (isActive) {
            player.play().catch(()=>{});
          } else {
            player.pause().catch(()=>{});
          }
        }
      });
    }

    document.querySelector('.next').addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % slides.length;
      showSlide(currentIndex);
    });

    document.querySelector('.prev').addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      showSlide(currentIndex);
    });

    window.addEventListener('load', () => {
      showSlide(currentIndex);
    });
  </script>
